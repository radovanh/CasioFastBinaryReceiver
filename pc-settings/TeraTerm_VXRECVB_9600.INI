; Tera Term settings for sending a .vxb file to VXRECVB (Casio VX-4 / FX-870P).
; Use it as the settings file:  ttermpro.exe /F=TeraTerm_VXRECVB_9600.INI
; or copy these keys into your own TERATERM.INI. Tera Term uses its defaults for
; every key not listed here. Change ComPort to your serial port; for 4800 baud set
; BaudRate=4800 (and leave line 25 of VXRECVB at B=4800).
[Tera Term]
Port=serial
ComPort=1
BaudRate=9600
Parity=none
DataBit=8
StopBit=1
; no flow control: VXRECVB opens COM0 without XON/XOFF (binary data contains &H11/&H13)
FlowCtrl=none
; no transmit delays (with 5 ms delays the transfer failed on the real machine)
DelayPerChar=0
DelayPerLine=0
; Send file: Binary ticked by default
TransBin=on
; feed the port gradually (the progress bar then follows the real transfer)
FileSendHighSpeedMode=off
SendfileDelayType=NoDelay
